
<style>
/* DISH CAFÉ — COMPACT SECRET OFFER */

.chef-secret {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 9999;
    width: min(300px, calc(100vw - 32px));
    padding: 22px;
    background: #211D1A;
    border: 1px solid rgba(196,164,119,.45);
    box-shadow: 0 14px 45px rgba(0,0,0,.25);
    color: #F5F0E8;
    font-family: 'DM Sans', sans-serif;

    opacity: 0;
    visibility: hidden;
    transform: translateY(25px);
    transition: opacity .4s ease,
                transform .4s ease,
                visibility .4s;
}

.chef-secret.is-visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.chef-secret__header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.chef-secret__label {
    font-size: 10px;
    letter-spacing: 1.6px;
    color: #C4A477;
    text-transform: uppercase;
}

.chef-secret__close {
    border: 0;
    background: none;
    color: #F5F0E8;
    font-size: 23px;
    cursor: pointer;
}

.chef-secret__title {
    margin: 20px 0 8px;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 27px;
    font-weight: 400;
    line-height: 1.2;
}

.chef-secret__description {
    margin: 0 0 20px;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(245,240,232,.75);
}

.chef-secret__promo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border: 1px dashed #C4A477;
}

.chef-secret__code {
    color: #C4A477;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 2px;
}

.chef-secret__copy {
    padding: 7px 12px;
    border: 0;
    background: #C4A477;
    color: #211D1A;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
}

.chef-secret__note {
    margin: 12px 0 0;
    color: rgba(245,240,232,.6);
    font-size: 10px;
    line-height: 1.6;
}

@media (max-width: 767px) {
    .chef-secret {
        right: 16px;
        bottom: 16px;
        padding: 18px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .chef-secret {
        transition: none;
    }
}
</style>

<aside
    class="chef-secret"
    id="chefSecret"
    aria-label="Dish Café special offer"
    aria-hidden="true"
>
    <div class="chef-secret__header">
        <span class="chef-secret__label">
            ✦ Dish Café Exclusive
        </span>

        <button
            type="button"
            class="chef-secret__close"
            id="chefSecretClose"
            aria-label="Close offer"
        >
            &times;
        </button>
    </div>

    <h2 class="chef-secret__title">
        A little treat for you.
    </h2>

    <p class="chef-secret__description">
        Enjoy 10% off your next visit.
        A little secret, just for you.
    </p>

    <div class="chef-secret__promo">
        <span class="chef-secret__code" id="chefPromoCode">
            DISH10
        </span>

        <button
            type="button"
            class="chef-secret__copy"
            id="chefPromoCopy"
        >
            COPY
        </button>
    </div>

    <p class="chef-secret__note">
        Show this code to our team to request your discount.
    </p>
</aside>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const popup = document.getElementById("chefSecret");
    const closeButton = document.getElementById("chefSecretClose");
    const copyButton = document.getElementById("chefPromoCopy");
    const promoCode = document.getElementById("chefPromoCode");

    if (!popup || !closeButton || !copyButton || !promoCode) {
        return;
    }

    const storageKey = "dishCafePromoClosed";

    let dismissed = false;

    try {
        dismissed = sessionStorage.getItem(storageKey) === "yes";
    } catch (error) {}

    if (dismissed) return;

    let opened = false;

    function checkScroll() {
        if (opened) return;

        const scrollable =
            document.documentElement.scrollHeight - window.innerHeight;

        if (scrollable <= 0) return;

        if (window.scrollY / scrollable >= 0.35) {
            opened = true;
            popup.classList.add("is-visible");
            popup.setAttribute("aria-hidden", "false");
            window.removeEventListener("scroll", checkScroll);
        }
    }

    closeButton.addEventListener("click", function () {
        popup.classList.remove("is-visible");
        popup.setAttribute("aria-hidden", "true");

        try {
            sessionStorage.setItem(storageKey, "yes");
        } catch (error) {}
    });

    copyButton.addEventListener("click", async function () {
        const code = promoCode.textContent.trim();

        try {
            await navigator.clipboard.writeText(code);
        } catch (error) {
            const temporaryInput = document.createElement("textarea");
            temporaryInput.value = code;
            temporaryInput.style.position = "fixed";
            temporaryInput.style.opacity = "0";

            document.body.appendChild(temporaryInput);
            temporaryInput.select();

            const copied = document.execCommand("copy");
            temporaryInput.remove();

            if (!copied) {
                copyButton.textContent = "SELECT CODE";
                return;
            }
        }

        copyButton.textContent = "COPIED ✓";
    });

    window.addEventListener("scroll", checkScroll, {
        passive: true
    });

    checkScroll();
});
</script>
